server {
    listen 80;
    listen [::]:80;
    server_name memhot.angelkang.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/memhot-acme;
        default_type text/plain;
    }
    location / { return 301 https://memhot.angelkang.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name memhot.angelkang.com;
    ssl_certificate /etc/letsencrypt/live/memhot.angelkang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memhot.angelkang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/memhot.access.log;
    error_log /var/log/nginx/memhot.error.log warn;
    location = /updates/android-arm64.json {
        alias /opt/memhot/public/updates/android-arm64.json;
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store" always;
    }
    location = /downloads/memhot-0.3.3-arm64.apk {
        alias /opt/memhot/public/downloads/memhot-0.3.3-arm64.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=memhot-0.3.3-arm64.apk";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /downloads/memhot-0.3.3-arm64.apk.sha256 {
        alias /opt/memhot/public/downloads/memhot-0.3.3-arm64.apk.sha256;
        default_type text/plain;
        add_header Content-Disposition "attachment; filename=memhot-0.3.3-arm64.apk.sha256";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=3600";
    }
