    location = /downloads/memhot-0.1.0-arm64.apk {
        alias /opt/memhot/public/downloads/memhot-0.1.0-arm64.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=memhot-0.1.0-arm64.apk";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=3600";
    }
    # Stream audio to authenticated admission instead of spooling the entire WAV
    # in Nginx before the application can reject a busy or unauthorized request.
    location = /api/v1/audio {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
    location = /api/v1/discuss {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 780s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
