# Deployment replaces the marker with a new secret generated only on the server.
use_default_settings:
  engines:
    keep_only: [duckduckgo, 360search]
general:
  debug: false
  instance_name: Memhot private search
  enable_metrics: false
search:
  safe_search: 1
  autocomplete: ""
  default_lang: auto
  formats: [json]
  max_page: 1
server:
  secret_key: GENERATE_ON_DEPLOY
  limiter: false
  public_instance: false
  image_proxy: false
  method: POST
outgoing:
  request_timeout: 5.0
  max_request_timeout: 8.0
  retries: 0
  pool_connections: 12
  pool_maxsize: 4
engines:
  - name: duckduckgo
    disabled: false
  - name: 360search
    disabled: false
    timeout: 5.0
