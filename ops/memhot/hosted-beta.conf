[Service]
Environment=MEMHOT_PROVIDER_FILE=/var/lib/memhot/providers.json
Environment=MEMHOT_SEARCH_URL=http://127.0.0.1:8791
Environment=MEMHOT_PUBLIC_DAILY_CALL_LIMIT=20
Environment=MEMHOT_AIHOT_ENABLED=1
Environment=MEMHOT_AGENT_NODE=/opt/memhot/runtime/node-v22.23.3-linux-x64/bin/node
Environment=MEMHOT_AGENT_SCRIPT=/opt/memhot/current/agent/src/main.mjs
MemoryHigh=256M
MemoryMax=384M
CPUQuota=100%
# Let accepted ASR/discussion HTTP requests finish during a drained deployment.
TimeoutStopSec=820s
