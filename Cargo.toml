[workspace]
members = [
    "apps/memhot/src-tauri",
    "backend/apps/memhot-server",
    "backend/crates/agent-contracts",
    "backend/crates/asr-service",
    "backend/crates/audio-contracts",
    "backend/crates/model-runtime",
    "backend/crates/provider-config",
    "plugins/memhot-capture",
    "plugins/memhot-updater"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
getrandom = "0.3"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
