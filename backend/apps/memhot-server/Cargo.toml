[package]
name = "memhot-server"
version = "0.3.12"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
argon2 = "=0.5.3"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
getrandom.workspace = true
model-runtime = { path = "../../crates/model-runtime" }
asr-service = { path = "../../crates/asr-service" }
reqwest = { workspace = true, features = ["multipart", "stream"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "net", "fs", "signal", "io-util", "process"] }
quick-xml = "0.41"
dom_query = "0.27"
tower-http = { version = "0.6", features = ["cors", "limit", "timeout"] }

[dev-dependencies]
futures-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
